<!DOCTYPE html><html lang="es" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4a5230"><title>MetraObra · Cómputos de obra</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MetraObra"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#f3eedc;--bg2:#e9e2c8;--fg:#232618;--mut:#5a5f3f;--acc:#4a5230;--accf:#f3eedc;--line:#d6cfae;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[data-theme=dark]{--bg:#141710;--bg2:#1e2316;--fg:#ece7d2;--mut:#b4b090;--acc:#a8b574;--accf:#141710;--line:#2d3421}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:300 16px/1.5 'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:1000px;margin:0 auto;min-height:100vh;padding:0 1.2rem 3rem}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:.8rem 0 .3rem;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem}
h1{font-size:1.45rem;font-weight:600}h1 small{display:block;font-size:.8rem;font-weight:300}h2{font-size:1.5rem;font-weight:500;margin:.6rem 0}h3{font-size:1.05rem;font-weight:500;margin:1.3rem 0 .4rem}
.mut,small{color:var(--mut)}
.ib{background:none;border:1px solid var(--line);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.1rem;flex:none}
.pill{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.5rem .9rem;background:var(--bg2);border:1px solid var(--line);border-radius:10px;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#dr{position:fixed;top:0;bottom:0;left:0;width:min(280px,82vw);background:var(--bg);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .25s;z-index:10;padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem 1rem}
body.mo #ov{opacity:1;pointer-events:auto}body.mo #dr{transform:none}
#dr button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:.9rem 1rem;font-size:1.05rem;cursor:pointer}
#dr button.on{border-left-color:var(--acc);background:var(--bg2);font-weight:500}
.brand{display:flex;align-items:center;gap:.6rem;flex:1}.lg{width:34px;height:34px;flex:none}
@media(prefers-reduced-motion:reduce){#ov,#dr{transition:none}}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.3rem 0 .8rem;scrollbar-width:none}
.chips button{flex:none;padding:.5rem 1rem;border:1px solid var(--line);background:none;border-radius:99px;cursor:pointer}
.chips button.on{background:var(--acc);color:var(--accf);border-color:var(--acc)}
input,select{width:100%;padding:.75rem 1rem;background:var(--bg2);border:1px solid var(--line);border-radius:10px;margin:.3rem 0 .6rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{display:block;width:100%;text-align:left;background:var(--bg2);border:0;border-left:4px solid var(--line);padding:1rem;margin-bottom:.7rem;cursor:pointer}
.card.on{border-left-color:var(--acc)}.card b{display:block;font-weight:500;font-size:1.05rem}.card small{display:block}
.btn{display:block;width:100%;padding:.95rem;margin-top:1rem;background:var(--acc);color:var(--accf);border:1px solid var(--acc);cursor:pointer;font-weight:500;border-radius:10px}.btn.ghost{background:none;color:var(--acc)}
.fs{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}@media(min-width:760px){.fs{grid-template-columns:repeat(3,1fr)}}.fs label{font-size:.88rem;color:var(--mut)}
.res{background:var(--bg2);border-left:4px solid var(--acc);padding:.5rem 1rem;margin-top:.6rem}.res div{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px solid var(--line)}.res div:last-child{border:0}
.cc{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;margin-bottom:.8rem}
.ch{display:flex;justify-content:space-between;gap:.5rem}.ch b{font-weight:500}.ch small{display:block}
.mini{font-size:.9rem;margin:.5rem 0}
.it{display:grid;grid-template-columns:1fr 105px;gap:.6rem;align-items:center;padding:.4rem 0;border-top:1px solid var(--line)}.it input{margin:0;padding:.5rem .7rem}
.x{background:none;border:0;font-size:1.5rem;color:var(--mut);cursor:pointer;line-height:1}
.sum{background:var(--bg2);border-left:4px solid var(--acc);padding:.6rem 1rem;margin:.6rem 0}.sum div{display:flex;justify-content:space-between;padding:.25rem 0}
.tot{font-size:1.3rem;font-weight:500;border-top:1px solid var(--line);margin-top:.3rem;padding-top:.5rem!important}
.nm{font-size:1.3rem;font-weight:500}
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);background:var(--acc);color:var(--accf);padding:.7rem 1.2rem;border-radius:99px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
</style></head><body>
<header><div class="top"><button class="ib" id="mb" aria-label="Abrir menú"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button><div class="brand"><svg class="lg" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="var(--acc)"/><path d="M30 20v10M70 20v10M30 25h40" stroke="var(--accf)" stroke-width="3" fill="none"/><rect x="30" y="38" width="40" height="40" fill="var(--accf)"/></svg><h1>MetraObra<small id="st">Cómputos de obra</small></h1></div><button class="ib" id="th" aria-label="Cambiar modo claro u oscuro">◐</button></div><button class="pill" id="pj"></button></header>
<main id="m"></main><div id="ov"></div><aside id="dr"></aside><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},set=(k,x)=>{try{localStorage.setItem(k,x)}catch(e){}};
let dk=get('mo_t')?get('mo_t')=='d':matchMedia('(prefers-color-scheme:dark)').matches;
const theme=()=>{document.documentElement.dataset.theme=dk?'dark':'light';set('mo_t',dk?'d':'l')};theme();$('#th').onclick=()=>{dk=!dk;theme()};
const F=x=>(+x||0).toLocaleString('es-VE',{maximumFractionDigits:2}),D=t=>new Date(t).toLocaleString('es-VE',{dateStyle:'short',timeStyle:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* Valores referenciales: ajústalos a tu diseño de mezcla y a tus proveedores. */
const V=b=>typeof b=='string'?E(b):F(b),SACO=42.5;
const PIE={'Zapata':'1"','Pedestal':'3/4"','Solado / mampostería de fundación':'1"','Viga de riostra':'3/4"','Losa de fundación':'1"','Columna':'3/4"','Viga aérea':'3/4"','Losa maciza':'3/4"','Losa nervada (espesor equivalente)':'1/2"'}; // tamaño de piedra recomendado en obra
const MIX={210:[9.73,.52,.53,.186],250:[11.5,.5,.51,.19],280:[12.6,.48,.5,.192],350:[14.6,.45,.48,.196]}; // sacos 42,5 kg, arena m³, piedra m³, agua m³ por m³
const REB={'3/8':9.5,'1/2':12.7,'5/8':15.9,'3/4':19.1,'1':25.4};
const EL={'Zapata':'Infraestructura','Pedestal':'Infraestructura','Solado / mampostería de fundación':'Infraestructura','Viga de riostra':'Infraestructura','Losa de fundación':'Infraestructura','Columna':'Estructura','Viga aérea':'Estructura','Losa maciza':'Estructura','Losa nervada (espesor equivalente)':'Estructura'};
const Q={'Zapata':70,'Pedestal':120,'Solado / mampostería de fundación':0,'Viga de riostra':100,'Losa de fundación':80,'Columna':140,'Viga aérea':120,'Losa maciza':90,'Losa nervada (espesor equivalente)':70}; // kg de acero por m³ de concreto
const MOR={'1:3':[11.3,1],'1:4':[9,1.05],'1:5':[7.5,1.1]}; // sacos y arena m³ por m³ de mortero
const SUP={'Concreto gris virgen o poroso':.25,'Friso nuevo':.2,'Pared pintada en buen estado':0,'Pared pintada deteriorada':.1};
const PIN={'Caucho':30,'Aceite':35,'Epóxica':25,'Asfáltica':20}; // m² por galón y por mano
const els=Object.keys(EL);
const C=[
{n:'Concreto',nota:'Dimensiones de una pieza y su cantidad. La piedra recomendada depende del elemento. Criterio general de las normas de concreto: el tamaño máximo no debe pasar de 1/5 de la menor dimensión del elemento, 1/3 del espesor de las losas ni 3/4 de la separación libre entre barras. Confírmalo con COVENIN 1753 y tu ingeniero.',
 f:[['e','Elemento',els,'Columna'],['L','Largo','m',.3],['A','Ancho','m',.3],['H','Alto o espesor','m',3],['n','Cantidad','und',4],['fc','f\'c (kg/cm²)',[210,250,280,350],210],['pi','Piedra picada',['Recomendada','1/2"','3/4"','1"','1 1/2"','2"'],'Recomendada'],['t','Tipo de concreto',['Hecho en obra','Premezclado'],'Hecho en obra'],['w','Desperdicio','%',5]],
 r:v=>{const net=v.L*v.A*v.H*v.n,m=net*(1+v.w/100),t=MIX[v.fc],ob=v.t=='Hecho en obra',rec=PIE[v.e],pz=v.pi=='Recomendada'?rec:v.pi,k=m*t[0],s=`${v.e} f'c ${v.fc}: ${v.L}×${v.A}×${v.H} m × ${v.n}`;
  const rows=[['Volumen neto',net,'m³'],['Volumen con desperdicio',m,'m³'],['Piedra recomendada para '+v.e.toLowerCase(),rec,'']];
  if(ob)rows.push([`Cemento (saco de ${F(SACO)} kg)`,k,'sacos'],['Peso del cemento',k*SACO,'kg'],['Arena',m*t[1],'m³'],[`Piedra picada (${pz})`,m*t[2],'m³'],['Agua',m*t[3]*1000,'L']);
  return{g:EL[v.e],src:s+(ob?`, piedra ${pz}`:''),rows,add:ob?[{d:`Cemento (saco de ${F(SACO)} kg)`,u:'sacos',q:k},{d:'Arena (concreto)',u:'m³',q:m*t[1]},{d:`Piedra picada ${pz} (concreto)`,u:'m³',q:m*t[2]}]:[{d:`Concreto premezclado f'c ${v.fc}`,u:'m³',q:m}]}}},
{n:'Encofrado',nota:'Área de contacto = perímetro expuesto × altura. Considera los usos de la madera y los clavos.',
 f:[['e','Elemento',els,'Columna'],['L','Largo','m',.3],['A','Ancho','m',.3],['H','Altura','m',3],['n','Cantidad','und',4],['u','Usos de la madera','',3]],
 r:v=>{const ac=2*(v.L+v.A)*v.H*v.n,mad=v.u?ac/v.u:ac,cl=ac*.15;
  return{g:EL[v.e],src:`Encofrado ${v.e}: ${v.L}×${v.A}×${v.H} m × ${v.n}`,rows:[['Área de contacto',ac,'m²'],['Madera a comprar',mad,'m²'],['Clavos y soportes',cl,'kg']],add:[{d:`Encofrado ${v.e}`,u:'m²',q:ac},{d:'Clavos',u:'kg',q:cl}]}}},
{n:'Acero',nota:'Por metros lineales de campo o por cuantía típica (kg por m³ de concreto). Incluye traslapes y desperdicio.',
 f:[['m','Método',['Por metros lineales','Por cuantía'],'Por metros lineales'],['d','Diámetro (pulg.)',Object.keys(REB),'1/2'],['Lt','Metros lineales (método 1)','m',100],['e','Elemento (método 2)',els,'Columna'],['V','Volumen de concreto (método 2)','m³',1],['Lb','Largo de la varilla','m',12],['w','Traslapes y desperdicio','%',8]],
 r:v=>{const kgm=REB[v.d]**2/162,pc=v.m=='Por cuantía',kg=pc?v.V*Q[v.e]*(1+v.w/100):kgm*v.Lt*(1+v.w/100),lm=kg/kgm;
  return{g:pc?EL[v.e]:'Estructura',src:pc?`Acero ø ${v.d}" por cuantía, ${v.e} ${F(v.V)} m³`:`Acero ø ${v.d}": ${F(v.Lt)} m`,rows:[['Peso por metro',kgm,'kg/m'],['Longitud con desperdicio',lm,'m'],['Peso total',kg,'kg'],['Varillas comerciales',v.Lb?Math.ceil(lm/v.Lb):0,'und']],add:[{d:`Acero ø ${v.d}"`,u:'kg',q:kg}]}}},
{n:'Bloques',nota:'Paredes de bloque con descuento de vanos, juntas de pega y 5% de rotura.',
 f:[['A','Área del muro','m²',30],['V','Vanos (puertas y ventanas)','m²',4],['es','Espesor del bloque (cm)',[10,15,20],15],['bl','Largo real (cm)','',39],['bh','Alto real (cm)','',19],['j','Junta','cm',1],['w','Rotura y corte','%',5]],
 r:v=>{const a=Math.max(v.A-v.V,0),pm=1/(((+v.bl+v.j)/100)*((+v.bh+v.j)/100)),b=Math.ceil(a*pm*(1+v.w/100)),mo=a*(v.es/100)*(1-pm*(v.bl/100)*(v.bh/100))*(1+v.w/100),m=MOR['1:4'];
  return{g:'Mampostería',src:`Muro de bloque de ${v.es} cm, ${F(a)} m² netos`,rows:[['Área neta',a,'m²'],['Bloques por m²',pm,'und'],['Bloques totales',b,'und'],['Mortero de pega (1:4)',mo,'m³'],['Cemento (saco de 42,5 kg)',mo*m[0],'sacos'],['Arena',mo*m[1],'m³']],add:[{d:`Bloques de ${v.es} cm`,u:'und',q:b},{d:'Cemento (pega, saco de 42,5 kg)',u:'sacos',q:mo*m[0]},{d:'Arena (pega)',u:'m³',q:mo*m[1]}]}}},
{n:'Friso',nota:'Pañete interno o externo y morteros de nivelación. Suma 10–15% por rebote.',
 f:[['t','Aplicación',['Friso interno','Friso externo','Mortero de nivelación de piso'],'Friso interno'],['A','Área','m²',50],['e','Espesor','cm',2],['p','Mortero cemento:arena',Object.keys(MOR),'1:4'],['w','Rebote y mermas','%',12]],
 r:v=>{const m=v.A*v.e/100*(1+v.w/100),t=MOR[v.p];
  return{g:'Revestimientos',src:`${v.t} ${v.p}: ${F(v.A)} m² × ${v.e} cm`,rows:[['Mortero',m,'m³'],['Cemento (saco de 42,5 kg)',m*t[0],'sacos'],['Arena',m*t[1],'m³']],add:[{d:`Cemento (${v.t.toLowerCase()}, saco de 42,5 kg)`,u:'sacos',q:m*t[0]},{d:`Arena (${v.t.toLowerCase()})`,u:'m³',q:m*t[1]}]}}},
{n:'Impermeabilización',nota:'Manto asfáltico con solapes de 10–12% e imprimación asfáltica (primer).',
 f:[['A','Área (techo, losa o terraza)','m²',60],['s','Solapes','%',11],['ro','Área por rollo','m²',10],['r','Rendimiento del primer','m²/L',5]],
 r:v=>{const a=v.A*(1+v.s/100),l=v.r?v.A/v.r:0;
  return{g:'Impermeabilización',src:`Manto asfáltico en ${F(v.A)} m²`,rows:[['Manto con solapes',a,'m²'],['Rollos',v.ro?Math.ceil(a/v.ro):0,'und'],['Primer asfáltico',l,'L'],['Galones de primer',l/3.785,'gal']],add:[{d:'Manto asfáltico',u:'m²',q:a},{d:'Imprimación asfáltica',u:'L',q:l}]}}},
{n:'Pintura',nota:'Según superficie y tipo de pintura. Las superficies porosas piden sellador o más pintura en la primera mano.',
 f:[['z','Destino',['Paredes','Techos y cielorrasos'],'Paredes'],['A','Área','m²',80],['s','Superficie',Object.keys(SUP),'Friso nuevo'],['t','Tipo de pintura',Object.keys(PIN),'Caucho'],['m','Manos','',2],['r','Rendimiento (0 = el del tipo)','m²/gal',0],['w','Salpicaduras y residuos','%',5]],
 r:v=>{const r=v.r||PIN[v.t],g=(v.A*v.m/r+v.A/r*SUP[v.s])*(1+v.w/100);
  return{g:'Pintura',src:`${v.t} en ${v.z.toLowerCase()}: ${F(v.A)} m², ${v.m} manos, ${v.s.toLowerCase()}`,rows:[['Rendimiento usado',r,'m²/gal'],['Pintura necesaria',g,'gal'],['Equivale a',g*3.785,'L']],add:[{d:`Pintura ${v.t.toLowerCase()} (${v.z.toLowerCase()})`,u:'gal',q:g}]}}}
];
let P=[],A=get('mo_a')||'',cur=0,view='p';try{P=JSON.parse(get('mo_p')||'[]')}catch(e){}
const save=()=>{set('mo_p',JSON.stringify(P));set('mo_a',A)};
const proj=()=>P.find(p=>p.id==A);
const sub=c=>c.add.reduce((s,a)=>s+a.q*(a.p||0),0),tot=p=>p.calcs.reduce((s,c)=>s+sub(c),0);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1700)};
const conf=(b,fn)=>{const t=b.textContent;b.onclick=()=>{if(b.dataset.s){fn();return}b.dataset.s=1;b.textContent='Toca otra vez para confirmar';setTimeout(()=>{delete b.dataset.s;b.textContent=t},3000)}};
function go(v){view=v;render()}
function render(){
  const p=proj();$('#pj').innerHTML=p?`Proyecto: <b>${E(p.name)}</b>`:'Sin proyecto activo · toca para crear uno';$('#pj').onclick=()=>go('p');
  const S=[['p','Proyectos'],['c','Calcular'],['h','Historial']];
  $('#dr').innerHTML='<small class="mut" style="display:block;padding:.4rem 1rem 1rem">Menú</small>'+S.map(([k,n])=>`<button data-v="${k}" class="${k==view?'on':''}">${n}</button>`).join('');
  document.querySelectorAll('#dr button').forEach(b=>b.onclick=()=>{document.body.classList.remove('mo');go(b.dataset.v)});
  $('#mb').onclick=()=>document.body.classList.add('mo');$('#ov').onclick=()=>document.body.classList.remove('mo');
  $('#st').textContent=S.find(s=>s[0]==view)[1];
  view=='p'?projects():view=='c'?calc():hist();scrollTo(0,0);
}
function newProj(name){const p={id:uid(),name:name||'Mi proyecto',t:Date.now(),calcs:[]};P.unshift(p);A=p.id;save();return p}
function projects(){
  $('#m').innerHTML=`<h2>Proyectos</h2><p class="mut">Cada proyecto guarda sus cálculos y partidas como historial.</p><input id="pn" placeholder="Nombre del proyecto, por ejemplo Casa Los Samanes"><button class="btn" id="pc" style="margin-top:0">Crear proyecto</button><h3>Tus proyectos</h3>`+(P.length?P.map(p=>`<button class="card ${p.id==A?'on':''}" data-id="${p.id}"><b>${E(p.name)}</b><small>${p.calcs.length} cálculos · creado ${D(p.t)}</small><small>Total: ${F(tot(p))}</small></button>`).join(''):'<p class="mut">Aún no tienes proyectos. Crea el primero arriba.</p>');
  $('#pc').onclick=()=>{newProj($('#pn').value.trim());go('c')};
  document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{A=b.dataset.id;save();go('h')});
}
function calc(){
  const c=C[cur];
  $('#m').innerHTML=`<div class="chips">${C.map((x,i)=>`<button class="${i==cur?'on':''}" data-i="${i}">${x.n}</button>`).join('')}</div><h2>${c.n}</h2><p class="mut">${c.nota}</p><div class="fs" style="margin-top:.8rem">${c.f.map(([k,l,u,d])=>Array.isArray(u)?`<label>${l}<select id="f_${k}">${u.map(o=>`<option${o==d?' selected':''}>${E(o)}</option>`).join('')}</select></label>`:`<label>${l}${u?` (${u})`:''}<input id="f_${k}" inputmode="decimal" value="${d}"></label>`).join('')}</div><div class="res" id="rs"></div><button class="btn" id="ad">Guardar en el proyecto</button>`;
  document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;calc();scrollTo(0,0)});
  const run=()=>{const v={};c.f.forEach(([k])=>{const e=$('#f_'+k);v[k]=e.tagName=='SELECT'?e.value:(+String(e.value).replace(',','.')||0)});const r=c.r(v);$('#rs').innerHTML=r.rows.map(([a,b,u])=>`<div><span>${a}</span><b>${V(b)} ${u}</b></div>`).join('');return r};
  document.querySelectorAll('.fs input,.fs select').forEach(e=>e.oninput=run);run();
  $('#ad').onclick=()=>{const r=run();let p=proj()||newProj('');p.calcs.unshift({id:uid(),t:Date.now(),mod:c.n,src:r.src,g:r.g,rows:r.rows,add:r.add.map(a=>({...a,p:0}))});save();render();toast('Guardado en '+p.name)};
}
function sumHtml(p){
  const g={};p.calcs.forEach(c=>g[c.g]=(g[c.g]||0)+sub(c));
  return Object.keys(g).map(k=>`<div><span>${k}</span><b>${F(g[k])}</b></div>`).join('')+`<div class="tot"><span>Total</span><b>${F(tot(p))}</b></div>`;
}
function hist(){
  const p=proj();
  if(!p){$('#m').innerHTML='<h2>Historial</h2><p class="mut">Elige o crea un proyecto para ver sus cálculos.</p><button class="btn" id="go">Ir a proyectos</button>';$('#go').onclick=()=>go('p');return}
  $('#m').innerHTML=`<input class="nm" id="rn" value="${E(p.name)}" aria-label="Nombre del proyecto"><small>Creado ${D(p.t)} · ${p.calcs.length} cálculos</small><h3>Costo por categoría</h3><div class="sum" id="sm">${sumHtml(p)}</div><h3>Historial de cálculos</h3>`+
  (p.calcs.length?p.calcs.map(c=>`<div class="cc"><div class="ch"><div><b>${c.mod} · ${E(c.g)}</b><small>${E(c.src)}</small><small>${D(c.t)}</small></div><button class="x" data-d="${c.id}" aria-label="Quitar cálculo">×</button></div><div class="mini">${c.rows.map(([a,b,u])=>`<div style="display:flex;justify-content:space-between"><span>${a}</span><span>${V(b)} ${u}</span></div>`).join('')}</div>${c.add.map((a,i)=>`<div class="it"><div><b style="font-weight:500">${E(a.d)}</b><small>${F(a.q)} ${a.u}</small></div><input inputmode="decimal" placeholder="Precio unit." data-c="${c.id}" data-a="${i}" value="${a.p||''}"></div>`).join('')}</div>`).join(''):'<p class="mut">Sin cálculos todavía. Ve a «Calcular» y guarda el primero.</p>')+
  `<button class="btn" id="cp">Copiar resumen</button><button class="btn ghost" id="dp">Eliminar proyecto</button>`;
  $('#rn').oninput=e=>{p.name=e.target.value||'Sin nombre';save();$('#pj').innerHTML=`Proyecto: <b>${E(p.name)}</b>`};
  document.querySelectorAll('.it input').forEach(e=>e.oninput=()=>{p.calcs.find(c=>c.id==e.dataset.c).add[+e.dataset.a].p=+String(e.value).replace(',','.')||0;save();$('#sm').innerHTML=sumHtml(p)});
  document.querySelectorAll('.x').forEach(b=>b.onclick=()=>{p.calcs=p.calcs.filter(c=>c.id!=b.dataset.d);save();render()});
  $('#cp').onclick=()=>{const t=`${p.name}\n`+p.calcs.slice().reverse().map(c=>`\n${c.mod} · ${c.src}\n`+c.add.map(a=>`  ${a.d}: ${F(a.q)} ${a.u}${a.p?` x ${F(a.p)} = ${F(a.q*a.p)}`:''}`).join('\n')).join('\n')+`\n\nTotal: ${F(tot(p))}`;try{navigator.clipboard.writeText(t).then(()=>toast('Resumen copiado'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}};
  conf($('#dp'),()=>{P=P.filter(x=>x.id!=p.id);A=P[0]?P[0].id:'';save();go('p')});
}
render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
