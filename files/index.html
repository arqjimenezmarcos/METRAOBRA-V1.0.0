<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},set=(k,x)=>{try{localStorage.setItem(k,x)}catch(e){}};
let dk=get('mo_t')?get('mo_t')=='d':matchMedia('(prefers-color-scheme:dark)').matches;
const theme=()=>{document.documentElement.dataset.theme=dk?'dark':'light';set('mo_t',dk?'d':'l')};theme();$('#th').onclick=()=>{dk=!dk;theme()};
const F=x=>(+x||0).toLocaleString('es-VE',{maximumFractionDigits:2}),D=t=>new Date(t).toLocaleString('es-VE',{dateStyle:'short',timeStyle:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* Valores referenciales: ajústalos a tu diseño de mezcla y a tus proveedores. */
const V=b=>typeof b=='string'?E(b):F(b),SACO=42.5;
const PIE={'Zapata':'1"','Pedestal':'3/4"','Solado / mampostería de fundación':'1"','Viga de riostra':'3/4"','Losa de fundación':'1"','Columna':'3/4"','Viga aérea':'3/4"','Losa maciza':'3/4"','Losa nervada (espesor equivalente)':'1/2"'}; // tamaño de piedra recomendado en obra
const FSUELTO=1.55,DCEM=1440; // factor de volumen suelto y densidad aparente del cemento (kg/m³)
const mezcla=(m,pr,ac,saco)=>{const [c,a,g]=pr.split(':').map(Number),S=c+a+g,vs=m*FSUELTO,kg=vs*c/S*DCEM;return{kg,sacos:kg/saco,arena:vs*a/S,grava:vs*g/S,agua:kg*ac}}; // Vseco=V×1.55; cemento=Vseco×C/(C+A+G)×1440; agua=cemento×a/c
const DREC={'Zapata':'1/2','Pedestal':'5/8','Solado / mampostería de fundación':'3/8','Viga de riostra':'1/2','Losa de fundación':'1/2','Columna':'5/8','Viga aérea':'1/2','Losa maciza':'3/8','Losa nervada (espesor equivalente)':'3/8'}; // diámetro típico de cabilla por elemento (verificar en plano)
const REB={'3/8':9.5,'1/2':12.7,'5/8':15.9,'3/4':19.1,'1':25.4};
const EL={'Zapata':'Infraestructura','Pedestal':'Infraestructura','Solado / mampostería de fundación':'Infraestructura','Viga de riostra':'Infraestructura','Losa de fundación':'Infraestructura','Columna':'Estructura','Viga aérea':'Estructura','Losa maciza':'Estructura','Losa nervada (espesor equivalente)':'Estructura'};
const Q={'Zapata':70,'Pedestal':120,'Solado / mampostería de fundación':0,'Viga de riostra':100,'Losa de fundación':80,'Columna':140,'Viga aérea':120,'Losa maciza':90,'Losa nervada (espesor equivalente)':70}; // kg de acero por m³ de concreto
const MOR={'1:3':[11.3,1],'1:4':[9,1.05],'1:5':[7.5,1.1]}; // sacos y arena m³ por m³ de mortero
const SUP={'Concreto gris virgen o poroso':.25,'Friso nuevo':.2,'Pared pintada en buen estado':0,'Pared pintada deteriorada':.1};
const PIN={'Caucho':30,'Aceite':35,'Epóxica':25,'Asfáltica':20}; // m² por galón y por mano
const els=Object.keys(EL);
/* COVENIN 1753-2006: 3.3.1 tamaño máximo del agregado, 7.2.4 recubrimiento mínimo (cm) */
const REC={'Zapata':7.5,'Pedestal':4,'Solado / mampostería de fundación':7.5,'Viga de riostra':7.5,'Losa de fundación':7.5,'Columna':4,'Viga aérea':4,'Losa maciza':2,'Losa nervada (espesor equivalente)':2};
const PS=[['1/2"',1.27],['3/4"',1.9],['1"',2.54],['1 1/2"',3.81],['2"',5.08]];
const losa=e=>e.startsWith('Losa')&&e!='Losa de fundación'||e.startsWith('Losa de');
const pmax=(e,L,A,H,sep)=>{const m=Math.min(L,A,H)*100,c=[m/5,.75*sep];if(losa(e))c.push(H*100/3);const lim=Math.min(...c),ok=PS.filter(p=>p[1]<=lim);return[ok.length?ok[ok.length-1][0]:'menor de 1/2"',lim]};
const TC={'Lámina de zinc acanalada':.8,'Acerolit / lámina de acero':1,'Teja':0}; // ancho útil en m
const TL={'Lámina de zinc acanalada':[1.83,2.44,3.05,3.66],'Acerolit / lámina de acero':[2.44,3.05,3.66,4.27,4.88]}; // largos comerciales en pies (6, 8, 10, 12, 14 y 16): confirma con tu proveedor
const TJ={'Teja criolla de arcilla':25,'Teja española / romana de arcilla':12.3}; // piezas por m² referenciales: confirma con tu proveedor
const RN={'Pared de bloque':[10,'m²'],'Friso':[15,'m²'],'Cerámica':[8,'m²'],'Pintura':[40,'m²'],'Impermeabilización':[40,'m²'],'Encofrado de columnas y vigas':[8,'m²'],'Acero de refuerzo (armado)':[150,'kg'],'Excavación manual':[4,'m³'],'Vaciado de concreto':[3,'m³']}; // por cuadrilla de 1 maestro + 1 ayudante
const BT={'Bloque de concreto (COVENIN 42-82)':[39,19],'Bloque de arcilla hueco':[29,19],'Ladrillo macizo de arcilla':[24,6]}; // largo y alto reales en cm
/* Encofrado por elemento: c = caras de tabla, a = área de contacto, y = [yugos, longitud de cada uno], p = soportes */
const col={c:'4 caras',a:(L,A,H)=>2*(L+A)*H,y:(L,A,H,s)=>[Math.ceil(H/s)+1,2*(L+A)+.6],p:()=>2,pn:'Tornapuntas'},
 vig={c:'fondo y 2 laterales',a:(L,A,H)=>L*(A+2*H),y:(L,A,H,s)=>[Math.ceil(L/s)+1,A+2*H+.6],p:(L,A,H,s,q)=>Math.ceil(L/q)+1,pn:'Puntales (pies derechos)'},
 ros={c:'2 laterales',a:(L,A,H)=>2*L*H,y:vig.y,p:(L,A,H,s,q)=>2*(Math.ceil(L/q)+1),pn:'Estacas'},
 zap={c:'4 laterales',a:col.a,y:()=>[0,0],p:()=>4,pn:'Estacas'},
 fun={c:'bordes',a:col.a,y:()=>[0,0],p:(L,A,H,s,q)=>2*(Math.ceil(L/q)+Math.ceil(A/q)),pn:'Estacas'},
 los={c:'fondo y bordes',a:(L,A,H)=>L*A+2*(L+A)*H,y:()=>[0,0],p:(L,A,H,s,q)=>(Math.ceil(L/q)+1)*(Math.ceil(A/q)+1),pn:'Puntales (pies derechos)'};
const ENC={'Zapata':zap,'Pedestal':col,'Solado / mampostería de fundación':zap,'Viga de riostra':ros,'Losa de fundación':fun,'Columna':col,'Viga aérea':vig,'Losa maciza':los,'Losa nervada (espesor equivalente)':los};
const C=[
{n:'Concreto',nota:'Dimensiones de una pieza y su cantidad. La piedra se calcula con COVENIN 1753-2006, art. 3.3.1: el tamaño máximo no puede pasar de 1/5 de la menor separación entre lados del encofrado, 1/3 del espesor de las losas ni 3/4 de la separación libre entre barras. El f\'c mínimo en fundaciones es 210 kg/cm². Dosificación por volumen: Vseco = V × 1,55; cemento = Vseco × C/(C+A+G) × 1440 kg/m³; agua = cemento × a/c. Usa a/c entre 0,45 y 0,65 (menor a/c = más resistencia, menos trabajabilidad).',
 f:[['e','Elemento',els,'Columna'],['L','Largo','m',.3],['A','Ancho','m',.3],['H','Alto o espesor','m',3],['n','Cantidad','und',4],['sb','Separación libre entre barras','cm',5],['fc','f\'c (kg/cm²)',[210,250,280,350],210],['pr','Proporción C:A:G',['1:1.5:3','1:2:3','1:2:4','1:3:5'],'1:2:3'],['ac','Relación agua/cemento (a/c)','',0.5],['sk','Saco de cemento (kg)',[50,42.5],50],['pi','Piedra picada',['Recomendada','1/2"','3/4"','1"','1 1/2"','2"'],'Recomendada'],['t','Tipo de concreto',['Hecho en obra','Premezclado'],'Hecho en obra'],['w','Desperdicio','%',5]],
 r:v=>{const net=v.L*v.A*v.H*v.n,m=net*(1+v.w/100),t=mezcla(m,v.pr,v.ac,parseFloat(v.sk)),sk=parseFloat(v.sk),ob=v.t=='Hecho en obra',[rec,lim]=pmax(v.e,v.L,v.A,v.H,v.sb),pz=v.pi=='Recomendada'?rec:v.pi,k=t.sacos,s=`${v.e} f'c ${v.fc} (${v.pr}, a/c ${v.ac}): ${v.L}×${v.A}×${v.H} m × ${v.n}`;
  const rows=[['Volumen neto',net,'m³'],['Volumen con desperdicio',m,'m³'],['Tamaño máximo permitido (3.3.1)',F(lim)+' cm','' ],['Piedra recomendada',rec,''],['Recubrimiento mínimo (7.2.4)',F(REC[v.e])+' cm','']];
  if(ob)rows.push([`Cemento (saco de ${F(sk)} kg)`,k,'sacos'],['Peso del cemento',t.kg,'kg'],['Arena',t.arena,'m³'],[`Piedra picada (${pz})`,t.grava,'m³'],['Agua',t.agua,'L']);

const CAT=(()=>{const c=[],g=(G,d,u)=>c.push([G,d,u]),CA='Cemento y agregados',RV='Revestimientos y cerámica';
  [50,42.5].forEach(k=>g(CA,`Cemento (saco de ${F(k)} kg)`,'sacos'));g(CA,'Arena','m³');
  ['1/2"','3/4"','1"','1 1/2"','2"'].forEach(z=>g(CA,`Piedra picada ${z}`,'m³'));

  g('Impermeabilización y pintura','Manto asfáltico','m²');g('Impermeabilización y pintura','Imprimación asfáltica','L');Object.keys(PIN).forEach(x=>g('Impermeabilización y pintura',`Pintura ${x.toLowerCase()}`,'gal'));
  Object.keys(TL).forEach(t=>TL[t].forEach(l=>g('Techo',`${t} de ${F(l)} m`,'und')));Object.keys(TJ).forEach(t=>g('Techo',t,'und'));
  g('Encofrado',`Tablas de 1"×8"×${F(3)} m`,'piezas');g('Encofrado',`Listones de 2"×4"×${F(3)} m`,'piezas');g('Encofrado','Clavos de 2 1/2"','kg');g('Encofrado','Clavos de 3"','kg');
  Object.keys(RN).forEach(a=>g('Mano de obra (por día de cuadrilla)',`Cuadrilla · ${a}`,'días'));return c})();
let pf='t';
const setPR=()=>set('mo_pr',JSON.stringify(PR));
function precios(){
  const p=proj(),used=new Set(),dyn={},have=new Set(CAT.map(x=>x[1]));
  P.forEach(x=>x.calcs.forEach(c=>c.add.forEach(a=>{const k=norm(a);if(p&&x.id==p.id)used.add(k);if(!have.has(k))dyn[k]=['Otros materiales de tus proyectos',k,a.u]})));
  const all=[...CAT,...Object.values(dyn)],gs=[...new Set(all.map(x=>x[0]))],dt=t=>new Date(t).toLocaleDateString('es-VE');
  const row=([G,d,u])=>{const e=PR[d],on=used.has(d);return`<div class="pr" data-k="${E(d)}" data-u="${on?1:0}" data-h="${e?1:0}"><div><b>${E(d)}</b><small>por ${E(u)}${on?' · en tu proyecto':''}<span class="dt">${e?' · act. '+dt(e.t):''}</span></small></div><input inputmode="decimal" placeholder="0,00" value="${e?e.p:''}" aria-label="Precio en dólares de ${E(d)}"></div>`};
  $('#m').innerHTML=`<h2>A.P.U. · Precios unitarios</h2><p class="mut">Anota en dólares (US$) el precio de cada material una sola vez. Se aplica solo a todas tus partidas y proyectos. Si lo cambias en el Historial de cálculos, también se actualiza aquí: no repites precios que ya buscaste.</p><div class="chips" id="pfc"><button data-f="t">Todos</button><button data-f="u">En mi proyecto</button><button data-f="s">Me faltan</button></div><input type="search" id="pq" placeholder="Buscar material…" aria-label="Buscar material"><small id="pcn"></small>${gs.map(g=>`<div class="pgp"><h3>${E(g)}</h3>${all.filter(x=>x[0]==g).map(row).join('')}</div>`).join('')}<p class="mut" id="pnr" hidden>Sin resultados.</p>`;
  const ap=()=>{const q=$('#pq').value.trim().toLowerCase();let n=0;document.querySelectorAll('.pr').forEach(r=>{const ok=(pf=='t'||(pf=='u'&&r.dataset.u=='1')||(pf=='s'&&r.dataset.u=='1'&&r.dataset.h=='0'))&&r.dataset.k.toLowerCase().includes(q);r.hidden=!ok;if(ok)n++});
    document.querySelectorAll('.pgp').forEach(g=>g.hidden=!g.querySelector('.pr:not([hidden])'));$('#pnr').hidden=n>0;
    document.querySelectorAll('#pfc button').forEach(b=>b.classList.toggle('on',b.dataset.f==pf));
    const tu=document.querySelectorAll('.pr[data-u="1"]').length,mu=document.querySelectorAll('.pr[data-u="1"][data-h="0"]').length;
    $('#pcn').textContent=p?(tu?`En «${p.name}»: ${tu-mu} de ${tu} materiales con precio`:'Este proyecto aún no tiene cálculos.'):'Crea o elige un proyecto para ver «En mi proyecto».'};
  document.querySelectorAll('#pfc button').forEach(b=>b.onclick=()=>{pf=b.dataset.f;ap()});$('#pq').oninput=ap;
  document.querySelectorAll('.pr input').forEach(i=>i.oninput=()=>{const r=i.closest('.pr'),k=r.dataset.k,v=+String(i.value).replace(',','.')||0;

  ap()}
function hist(){
  const p=proj();

  const cc=c=>{const h=hero(c.rows);return`<details class="cc" data-q="${E((c.mod+' '+c.g+' '+c.src+' '+(c.ti||'')+' '+c.add.map(a=>a.d).join(' ')).toLowerCase())}"><summary><div><b>${E(c.ti||c.mod+' · '+c.g)}</b><small>${E(c.mod)} · ${V(h[1])} ${h[2]} ${E(h[0])}</small></div></summary><small>${E(c.src)} · ${D(c.t)}</small><div class="mini">${c.rows.map(([a,b,u])=>`<div style="display:flex;justify-content:space-between;gap:1rem"><span>${a}</span><span>${V(b)} ${u}</span></div>`).join('')}</div>${c.add.map((a,i)=>`<div class="it"><div><b style="font-weight:500">${E(a.d)}</b><small>${F(a.q)} ${a.u}</small></div><input inputmode="decimal" placeholder="Precio unit. US$" data-c="${c.id}" data-a="${i}" data-k="${E(norm(a))}" value="${up(a)||''}"></div>`).join('')}<div class="acts"><button class="btn ghost" data-dup="${c.id}">Duplicar</button><button class="btn ghost" data-d="${c.id}">Quitar</button></div></details>`};
  $('#m').innerHTML=`<input class="nm" id="rn" value="${E(p.name)}" aria-label="Nombre del proyecto"><small>Creado ${D(p.t)} · ${p.calcs.length} cálculos</small><fieldset class="gp"><legend>Datos de la obra (aparecen en PDF y Excel)</legend><label>Ubicación (dirección o sector)<input id="pl" placeholder="Ej.: Urb. Los Samanes, parcela 12" value="${E(p.loc||'')}"></label><label>Generado por (Ing./Arq.)<input id="pb" placeholder="Ej.: Ing. Juan Pérez" value="${E(get('mo_by')||'')}"></label></fieldset><h3>Costo por categoría (US$)</h3><div class="sum" id="sm">${sumHtml(p)}</div>`+
  (lista(p).some(a=>!a.p)?`<button class="btn ghost" id="mp">Faltan precios de ${lista(p).filter(a=>!a.p).length} materiales · Completar en A.P.U.</button>`:'')+(p.calcs.length?`<button class="btn" id="ls">Generar lista de materiales</button><div id="lb" hidden></div>`:'')+`<h3>Historial de cálculos</h3>`+
  (p.calcs.length?`<input type="search" id="qs" placeholder="Buscar: losa nervada, acero, cemento…" aria-label="Buscar en el historial">`+p.calcs.map(cc).join('')+'<p class="mut" id="nq" hidden>Sin resultados.</p>':'<p class="mut">Sin cálculos todavía. Ve a «Calcular» y guarda el primero.</p>')+
  `<button class="btn" id="wa">Compartir por WhatsApp</button><button class="btn ghost" id="pdf">Exportar a PDF</button><button class="btn ghost" id="xl">Exportar a Excel</button><button class="btn ghost" id="cp">Copiar resumen</button><button class="btn ghost" id="dp">Eliminar proyecto</button>`;
  $('#rn').oninput=e=>{p.name=e.target.value||'Sin nombre';save();$('#pj').innerHTML=`Proyecto: <b>${E(p.name)}</b>`};
  document.querySelectorAll('.it input').forEach(e=>e.oninput=()=>{const a=p.calcs.find(c=>c.id==e.dataset.c).add[+e.dataset.a],k=norm(a),v=+String(e.value).replace(',','.')||0;if(v>0)PR[k]={p:v,t:Date.now()};else delete PR[k];a.p=0;setPR();save();document.querySelectorAll('.it input').forEach(o=>{if(o!==e&&o.dataset.k==k)o.value=v||''});$('#sm').innerHTML=sumHtml(p)});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{p.calcs=p.calcs.filter(c=>c.id!=b.dataset.d);save();render()});
  document.querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{const c=p.calcs.find(x=>x.id==b.dataset.dup);if(c.v&&c.mi!=null){PRE=c.v;cur=c.mi;go('c');toast('Edita los valores y guarda')}else{p.calcs.unshift({...JSON.parse(JSON.stringify(c)),id:uid(),t:Date.now()});save();render();toast('Cálculo duplicado')}});

    $('#lc').onclick=()=>{try{navigator.clipboard.writeText(listaTxt(p)).then(()=>toast('Lista copiada'),()=>toast('No se pudo copiar'))}catch(e){toast('No se pudo copiar')}};$('#lw').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(listaTxt(p,1)),'_blank')};
  $('#pl').oninput=e=>{p.loc=e.target.value;save()};$('#pb').oninput=e=>set('mo_by',e.target.value);
  $('#xl').onclick=()=>{try{saveFile(xlsxBook(p),'MetraObra_'+(p.name.replace(/[^\w]+/g,'_').replace(/^_|_$/g,'')||'proyecto')+'.xlsx')}catch(e){toast('No se pudo crear el Excel')}};

  conf($('#dp'),()=>{P=P.filter(x=>x.id!=p.id);A=P[0]?P[0].id:'';save();go('p')});
