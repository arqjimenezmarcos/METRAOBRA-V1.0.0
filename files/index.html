const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fmtId=(s,m)=>{const t=String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''),L=/^[VEJGCP]/.test(t)?t[0]:'';let d=t.replace(/\D/g,'');

  el.addEventListener('input',()=>{const p=el.selectionStart,n=el.value.slice(0,p).replace(/[^A-Za-z0-9]/g,'').length,v=fx(el.value);el.value=v;let i=0,k=0;while(i<v.length&&k<n){if(/[A-Za-z0-9]/.test(v[i]))k++;i++}try{el.setSelectionRange(i,i)}catch(e){}onv(v)});

const F=x=>(+x||0).toLocaleString('es-VE',{maximumFractionDigits:2}),D=t=>new Date(t).toLocaleString('es-VE',{dateStyle:'short',timeStyle:'short'});

/* Valores referenciales: ajústalos a tu diseño de mezcla y a tus proveedores. */
const V=b=>typeof b=='string'?E(b):F(b),SACO=42.5;
